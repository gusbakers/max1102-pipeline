name: max-week5
services:
  kafka-storage-init:
    image: apache/kafka:4.3.1
    user: '0:0'
    entrypoint: ['/bin/sh', '-c']
    command: ['chown -R 1000:1000 /data']
    volumes:
      - week5-kafka:/data
  knowledge-db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: max_week5
      POSTGRES_USER: max_week5
      POSTGRES_PASSWORD: ${WEEK5_POSTGRES_PASSWORD:?Run python -m week5.setup_local first}
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - week5-postgres:/var/lib/postgresql/data
      - ./week5/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U max_week5 -d max_week5']
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:4.3.1
    ports: ['127.0.0.1:9092:9092']
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - week5-kafka:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
volumes:
  week5-postgres:
  week5-kafka:
