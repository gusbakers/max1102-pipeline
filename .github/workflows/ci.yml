name: MAX Week 4 CI-CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the tested main commit (requires ENABLE_CD)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: max-week4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: python -m pip install -r api/requirements-dev.txt
      - name: Test API and observability without provider credentials
        working-directory: api
        run: python -m pytest -q
      - run: python week4/scripts/package_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ github.sha }}
          path: release/api.zip
          if-no-files-found: error
          retention-days: 14
  check-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t max1102-airflow:3.2.0 airflow
      - name: Validate six tasks, retries and dependencies
        run: |
          docker run --rm --entrypoint python \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -v "$PWD/tests:/opt/project/tests:ro" \
            max1102-airflow:3.2.0 /opt/project/tests/check_dag.py
      - name: Package the tested Airflow source
        run: |
          mkdir -p release
          tar -czf release/airflow.tar.gz airflow/Dockerfile airflow/.dockerignore airflow/dags docker-compose.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: airflow-${{ github.sha }}
          path: release/airflow.tar.gz
          if-no-files-found: error
          retention-days: 14
  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r week4/requirements-dev.txt
      - run: python -m pytest week4/tests -q
      - run: node --test week4/tests/monitor_issue.test.js
      - name: Check shell syntax
        run: bash -n week4/scripts/azure_oidc.sh week4/scripts/deploy_airflow.sh ops/airflow/apply_release.sh
      - run: python -m compileall -q databricks/notebooks week4/scripts
      - name: Explain notebook validation scope
        run: echo 'Notebook syntax is checked. Spark/GX execution requires the actual Databricks workspace and reviewed source manifest.' >> "$GITHUB_STEP_SUMMARY"
  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra
      - name: Validate the Azure resource definitions without a cloud login
        run: |
          terraform -chdir=infra/azure init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/azure validate
      - name: Validate adopted roots when present
        run: |
          shopt -s nullglob
          for root in infra/adopted/*/; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Report activation state without exposing secrets
        env:
          API_CD: ${{ vars.ENABLE_CD }}
          NOTEBOOK_CD: ${{ vars.ENABLE_DATABRICKS_CD }}
          AIRFLOW_CD: ${{ vars.ENABLE_AIRFLOW_CD }}
        run: |
          echo "Azure CD enabled: ${API_CD:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Databricks CD enabled: ${NOTEBOOK_CD:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Airflow host CD enabled: ${AIRFLOW_CD:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo 'A skipped deployment is pending configuration, not evidence of a successful deployment.' >> "$GITHUB_STEP_SUMMARY"
  oidc-subject:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api://AzureADTokenExchange');
            core.setSecret(token);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            if (claims.repository !== context.repo.owner + '/' + context.repo.repo) throw new Error('Wrong repository');
            require('fs').writeFileSync('oidc-subject.json', JSON.stringify({subject:claims.sub, repository:claims.repository, commit:context.sha}));
            await core.summary.addHeading('Azure OIDC subject').addCodeBlock(claims.sub).addRaw('Use this subject, never the JWT, with week4/scripts/azure_oidc.py.').write();
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-subject-${{ github.sha }}
          path: oidc-subject.json
          retention-days: 14
          if-no-files-found: error
  deploy-api:
    needs: [api-tests, check-dag, tooling-tests, terraform-validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) && vars.ENABLE_CD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-${{ github.sha }}
          path: release
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Enable dependency build on the existing Python Web App
        run: |
          az webapp config appsettings set -g rg-max-week2-api \
            -n maxweek2-gusbakers-972358cb \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true --output none
          az webapp config set -g rg-max-week2-api \
            -n maxweek2-gusbakers-972358cb \
            --startup-file 'python -m uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log' --output none
      - uses: azure/webapps-deploy@v3
        with:
          app-name: maxweek2-gusbakers-972358cb
          package: release/api.zip
      - name: Verify health and the exact tested commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python week4/scripts/smoke.py --url https://maxweek2-gusbakers-972358cb.azurewebsites.net --commit "$EXPECTED_COMMIT"
  deploy-notebooks:
    needs: [api-tests, check-dag, tooling-tests, terraform-validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) && vars.ENABLE_DATABRICKS_CD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only the reviewed sources to idle jobs
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_NOTEBOOK_DIR: ${{ vars.DATABRICKS_NOTEBOOK_DIR }}
          DATABRICKS_JOB_IDS: ${{ vars.DATABRICKS_JOB_IDS }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python week4/scripts/deploy_notebooks.py
  deploy-airflow:
    needs: [api-tests, check-dag, tooling-tests, terraform-validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == true) && vars.ENABLE_AIRFLOW_CD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: airflow-${{ github.sha }}
          path: release
      - name: Update an existing dedicated Airflow host
        env:
          AIRFLOW_HOST: ${{ vars.AIRFLOW_HOST }}
          AIRFLOW_USER: ${{ vars.AIRFLOW_USER }}
          AIRFLOW_SSH_KEY: ${{ secrets.AIRFLOW_SSH_KEY }}
          AIRFLOW_KNOWN_HOSTS: ${{ secrets.AIRFLOW_KNOWN_HOSTS }}
        run: bash week4/scripts/deploy_airflow.sh
